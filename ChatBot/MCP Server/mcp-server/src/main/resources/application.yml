server:
  port: 8087

spring:
  application:
    name: mcp-server

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  ai:
    mcp:
      server:
        name: oms-mcp-server
        version: 1.0.0
        protocol: STREAMABLE

oms:
  auth:
    url: http://localhost:8083
    username: ${OMS_USERNAME}
    password: ${OMS_PASSWORD}

  api-gateway:
    url: http://localhost:8080