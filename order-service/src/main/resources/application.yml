spring:
  application:
    name: order-service
  config:
    import: configserver:http://localhost:8888

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  main:
    web-application-type: servlet

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuit-breakers
    endpoint:
      health:
        show-details: always
    tracing:
      sampling:
        probability: 1.0
      export:
        zipkin:
          endpoint: http://localhost:9411/api/v2/spans


resilience4j:
  circuit-breaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.example.orders.order.exception.ProductNotFoundException
        recordExceptions:
          - com.example.orders.order.exception.ProductServiceUnavailableException

jwt:
  secret: ${JWT_SECRET:my-local-development-secret-key-2026-oms-project}